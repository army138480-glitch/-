<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight | میدنایت</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --bg: #08070b;
            --card-bg: #121017;
            --border: #d1d5db;
            --purple: #a855f7;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(209, 213, 219, 0.2);
            width: 100%;
            max-width: 800px;
        }
        header h1 {
            font-size: 2.2rem;
            color: var(--text);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }
        header p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        .card h2 {
            font-size: 1.2rem;
            color: var(--purple);
            margin-bottom: 15px;
            border-right: 3px solid var(--purple);
            padding-right: 8px;
        }
        .field {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            background: #0d0b10;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--purple);
        }
        .toolbar {
            display: flex;
            gap: 10px;
            background: #0d0b10;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(209, 213, 219, 0.2);
            margin-bottom: 8px;
            align-items: center;
        }
